name: сборка, тесты и образ

on:
  push:
    branches: [master, main]
    tags: ['v*']
  # И на pull request: Dockerfile не собирается ни решением, ни тестами, поэтому сломанный он
  # обнаруживался бы только после вливания — на ветке, где чинить его уже мешает всем.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: s3l-roslyn-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Кэш пакетов
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-

      - run: dotnet restore Snail.MCP.Roslyn.sln

      - run: dotnet build Snail.MCP.Roslyn.sln -c Release --no-restore

      - name: Тесты
        run: >
          dotnet test Snail.MCP.Roslyn.sln -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: результаты тестов
          path: artifacts/tests

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Публикуем только по тегу: ветка и pull request собираются ради проверки, что образ собирается.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          # latest едет вместе с версией: развёртывание платформы тянет ${SWARM_TAG:-latest}, и без
          # этой строки выпущенный образ лежал бы в реестре под номером, которого никто не спрашивает.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

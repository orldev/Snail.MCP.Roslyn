name: build and tests

# The shared server CI of Snail.Sdk: the tests, the conformance check and the tool reference, then the framework-dependent
# server published and asked over stdio, every tool, the way a client starts it. The container image is image.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      name: Snail.MCP.Roslyn
      native: false
      contract-variable: SNAIL_ROSLYN_SERVER
